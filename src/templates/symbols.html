<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="extra-css">
    <link rel="stylesheet" th:href="@{/css/pages/symbols.css}">
</head>
<body>
<!--/*@thymesVar id="tree" type="dev.mattidragon.jsonpatcher.docs.tree.DocTree"*/-->
<!--/*@thymesVar id="util" type="dev.mattidragon.jsonpatcher.docgen.Render$UtilFunctions"*/-->
<th:block th:fragment="symbol-tree(tree)">
    <section class="doc-namespace"
             th:each="namespace : ${util.sortedNamespaces(tree)}"
             th:with="namespaceId=${#strings.listJoin(namespace.description.parts, '.')}"
             th:id="'namespace:' + ${namespaceId}">
        <th:block th:switch="${namespaceId}">
            <h2 th:case="''">
                (no namespace)
                <th:block th:replace="~{::section-link('namespace:')}"></th:block>
            </h2>
            <h2 th:case="*">
                Namespace <code th:text="${namespaceId}"></code>
                <th:block th:replace="~{::section-link('namespace:' + ${namespaceId})}"></th:block>
            </h2>
        </th:block>

        <th:block th:if="${namespace.entry} != null" th:insert="~{::entry-description(${namespace.entry})}"></th:block>

        <section class="doc-object"
                 th:each="object : ${util.sortedObjects(namespace)}"
                 th:with="objectId=${#strings.listJoin(namespace.description.withLast(object.name).parts, '.')}"
                 th:id="'object:' + ${objectId}">
            <h3 th:if="${object.entry} == null">
                Unknown object <code th:text="${object.name}"></code>
                <th:block th:replace="~{::section-link('object:' + ${objectId})}"></th:block>
            </h3>
            <h3 th:if="${object.entry instanceof dev.mattidragon.jsonpatcher.docs.data.DocEntry$LibraryEntry}">
                Library <code th:text="${object.name}"></code>
                <th:block th:if="${object.entry.location.isPresent()}">: <code class="keep-block" th:text="${object.entry.location.get()}"></code></th:block>
                <th:block th:replace="~{::section-link('object:' + ${objectId})}"></th:block>
            </h3>
            <h3 th:if="${object.entry instanceof dev.mattidragon.jsonpatcher.docs.data.DocEntry$GlobalLibraryEntry}">
                Global library <code th:text="${object.name}"></code>
                <th:block th:replace="~{::section-link('object:' + ${objectId})}"></th:block>
            </h3>
            <h3 th:if="${object.entry instanceof dev.mattidragon.jsonpatcher.docs.data.DocEntry$GlobalValueEntry}">
                Global variable <code th:text="${object.name}"></code>
                <th:block th:replace="~{::section-link('object:' + ${objectId})}"></th:block>
            </h3>
            <h3 th:if="${object.entry instanceof dev.mattidragon.jsonpatcher.docs.data.DocEntry$TypeDeclarationEntry}">
                Type <code th:text="${object.name}"></code> based on <code th:text="${object.entry.baseType.name.toLowerCase()}"></code>
                <th:block th:replace="~{::section-link('object:' + ${objectId})}"></th:block>
            </h3>
            <h3 th:if="${object.entry instanceof dev.mattidragon.jsonpatcher.docs.data.DocEntry$TypeAliasEntry}">
                Type alias <code th:text="${object.name}"></code> = <code class="keep-block" th:text="${util.formatDocType(object.entry.definition)}"></code>
                <th:block th:replace="~{::section-link('object:' + ${objectId})}"></th:block>
            </h3>
            <h3 th:if="${object.entry instanceof dev.mattidragon.jsonpatcher.docs.data.DocEntry$MetadataEntry}">
                Metadata tag <code th:text="'@' + ${object.name}"></code>: <code class="keep-block" th:text="${util.formatDocType(object.entry.type)}"></code>
                <th:block th:replace="~{::section-link('object:' + ${objectId})}"></th:block>
            </h3>

            <th:block th:if="${object.entry} != null" th:insert="~{::entry-description(${object.entry})}"></th:block>

            <section class="doc-property"
                     th:each="property : ${util.sortedProperties(object)}"
                     th:with="propertyId=${#strings.listJoin(property.entry.namespace.withLast(property.entry.owner).withLast(property.entry.name).parts, '.')},
                            isFunction=${property.entry.type instanceof dev.mattidragon.jsonpatcher.docs.type.FunctionDocType}"
                     th:id="'property:' + ${propertyId}"
                     th:attr="data-function=${isFunction}">
                <h4 th:if="${isFunction}">
                    Function <code th:text="${propertyId}"></code>: <code class="keep-block" th:text="${util.formatDocType(property.entry.type)}"></code>
                    <th:block th:replace="~{::section-link('property:' + ${propertyId})}"></th:block>
                </h4>
                <h4 th:if="!${isFunction}">
                    Property <code th:text="${propertyId}"></code>: <code class="keep-block" th:text="${util.formatDocType(property.entry.type)}"></code>
                    <th:block th:replace="~{::section-link('property:' + ${propertyId})}"></th:block>
                </h4>

                <th:block th:if="${property.entry} != null" th:insert="~{::entry-description(${property.entry})}"></th:block>
            </section>
        </section>
    </section>
</th:block>
<!--/*@thymesVar id="entry" type="dev.mattidragon.jsonpatcher.docs.data.DocEntry"*/-->
<th:block th:fragment="entry-description(entry)">
    <!--/*@thymesVar id="mdRenderer" type="org.commonmark.renderer.html.HtmlRenderer"*/-->
    <!--/*@thymesVar id="mdParser" type="org.commonmark.parser.Parser"*/-->
    <th:block th:utext="${mdRenderer.render(mdParser.parse(entry.sharedData.body))}"></th:block>
    <div class="doc-tag"
         th:each="tag : ${entry.sharedData.tags}">
        <th:block th:each="element : ${tag.formattedContent}"
                  th:utext="${mdRenderer.render(element)}">
        </th:block>
    </div>
</th:block>

<th:block th:fragment="section-link(id)">
    <a th:href="'#' + ${id}" class="section-link">
        <svg th:replace="~{icons::link('var(--section-link-color)')}"></svg>
    </a>
</th:block>

<th:block th:fragment="extra-nav(tree)">
    <h2 id="symbols-nav-title">Symbols</h2>
    <nav class="vertical-nav" aria-labelledby="symbols-nav-title">
        <ul>
            <li th:each="namespace : ${util.sortedNamespaces(tree)}"
                th:with="namespaceId=${#strings.listJoin(namespace.description.parts, '.')}">
                <details>
                    <summary>
                        <th:block th:switch="${namespaceId}">
                            <a th:data-symbol-type="namespace" th:case="''" href="#namespace:">(no namespace)</a>
                            <a th:data-symbol-type="namespace" th:case="*" th:href="'#namespace:' + ${namespaceId}" th:text="${namespaceId}"></a>
                        </th:block>
                    </summary>
                    <ul>
                        <li th:each="object : ${util.sortedObjects(namespace)}"
                            th:with="objectId=${#strings.listJoin(namespace.description.withLast(object.name).parts, '.')}">
                            <details th:if="${!object.properties.isEmpty()}">
                                <summary>
                                    <a th:data-symbol-type="${util.symbolTypeName(object.entry)}" th:href="'#object:' + ${objectId}" th:text="${object.name}"></a>
                                </summary>
                                <ul>
                                    <li th:each="property : ${util.sortedProperties(object)}"
                                        th:with="propertyId=${#strings.listJoin(property.entry.namespace.withLast(property.entry.owner).withLast(property.entry.name).parts, '.')}">
                                        <a th:data-symbol-type="${util.symbolTypeName(property.entry)}" th:href="'#property:' + ${propertyId}" th:text="${property.entry.name}"></a>
                                    </li>
                                </ul>
                            </details>
                            <a th:if="${object.properties.isEmpty()}" th:data-symbol-type="${util.symbolTypeName(object.entry)}" th:href="'#object:' + ${objectId}" th:text="${object.name}"></a>
                        </li>
                    </ul>
                </details>

            </li>
        </ul>
    </nav>
</th:block>
</body>
</html>

[versions]
jsonpatcher-lang = "4f8b01364c"
jsonpatcher-mod = "ced5ab1b7f"
jspecify = "1.0.0"
thymeleaf = "3.1.3.RELEASE"
slf4j = "2.0.17"
logback = "1.5.15"
commonmark = "0.28.0"

[libraries]
jsonpatcher-lang-stdlib = { module = "dev.mattidragon.JsonPatcherLang:JsonPatcherLang-Stdlib", version.ref = "jsonpatcher-lang" }
jsonpatcher-tools-docs = { module = "dev.mattidragon.JsonPatcherLang:JsonPatcher-Docs", version.ref = "jsonpatcher-lang" }
jsonpatcher-mod = { module = "dev.mattidragon:JsonPatcher", version.ref = "jsonpatcher-mod" }

commonmark-core = { module = "org.commonmark:commonmark", version.ref = "commonmark" }
commonmark-tables = { module = "org.commonmark:commonmark-ext-gfm-tables", version.ref = "commonmark" }
commonmark-strikethrough = { module = "org.commonmark:commonmark-ext-gfm-strikethrough", version.ref = "commonmark" }
commonmark-alerts = { module = "org.commonmark:commonmark-ext-gfm-alerts", version.ref = "commonmark" }
commonmark-anchors = { module = "org.commonmark:commonmark-ext-heading-anchor", version.ref = "commonmark" }

jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
thymeleaf = { module = "org.thymeleaf:thymeleaf", version.ref = "thymeleaf" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }

[bundles]
commonmark = ["commonmark-core", "commonmark-tables", "commonmark-strikethrough", "commonmark-alerts", "commonmark-anchors"]
